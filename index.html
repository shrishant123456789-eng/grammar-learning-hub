<!DOCTYPE html>
<html>
<head>
  <title>Grammar Learning Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Grammar Learning Hub</h1>
  <p class="tagline">Complete English Grammar Practice Platform</p>
  <p class="creator">Created by <b>Shrishant Yadav</b></p>
</header>

<main>

<button class="start-btn" onclick="showSyllabus()">Start Practice</button>

<div id="syllabus" style="display:none;">

<!-- ================= PHASE 1 ================= -->
<h2 class="phase">Phase 1: Foundations (The Basics)</h2>

<div id="phase1"></div>

<!-- ================= PHASE 2 ================= -->
<h2 class="phase">Phase 2: Functional Grammar (Core)</h2>
<div id="phase2"></div>

<!-- ================= PHASE 3 ================= -->
<h2 class="phase">Phase 3: Syntax and Mechanics</h2>
<div id="phase3"></div>

<!-- ================= PHASE 4 ================= -->
<h2 class="phase">Phase 4: Advanced Grammar</h2>
<div id="phase4"></div>

<!-- ================= PHASE 5 ================= -->
<h2 class="phase">Phase 5: Vocabulary & Composition</h2>
<div id="phase5"></div>

</div>
</main>

<footer>
  <img src="founder.jpg" alt="Founder Photo">
  <p>Founder<br><b>Shrishant Yadav</b></p>
</footer>

<script>
function showSyllabus(){
  document.getElementById("syllabus").style.display = "block";
}

/* ========= MASTER CHAPTER LIST ========= */
const chapters = {
  phase1: [
    {name:"The Sentence", file:"sentence.html"},
    {name:"Subject and Predicate", file:"subject-predicate.html"},
    {name:"Types of Sentences", file:"types-of-sentences.html"},
    {name:"Parts of Speech – Overview", file:"parts-of-speech.html"},
    {name:"Articles – A, An, The", file:"articles.html"},
    {name:"Nouns", file:"noun.html"},
    {name:"Kinds of Nouns", file:"kinds-of-nouns.html"},
    {name:"Noun: Number", file:"noun-number.html"},
    {name:"Noun: Gender", file:"noun-gender.html"},
    {name:"Noun: Case", file:"noun-case.html"},
    {name:"Pronouns", file:"pronouns.html"},
    {name:"Adjectives", file:"adjectives.html"}
  ],
  phase2: [
    {name:"Verbs", file:"verbs.html"},
    {name:"Tenses", file:"tenses.html"},
    {name:"Modals", file:"modals.html"},
    {name:"Active & Passive Voice", file:"active-passive.html"},
    {name:"Direct & Indirect Speech", file:"narration.html"}
  ],
  phase3: [
    {name:"Adverbs", file:"adverbs.html"},
    {name:"Prepositions", file:"prepositions.html"},
    {name:"Conjunctions", file:"conjunctions.html"}
  ],
  phase4: [
    {name:"Non-Finite Verbs", file:"non-finite.html"},
    {name:"Clauses", file:"clauses.html"},
    {name:"Transformation of Sentences", file:"transformation.html"}
  ],
  phase5: [
    {name:"Phrasal Verbs", file:"phrasal-verbs.html"},
    {name:"Idioms & Phrases", file:"idioms.html"},
    {name:"One-Word Substitution", file:"one-word.html"}
  ]
};

/* ========= AUTO RENDER ========= */
for (let phase in chapters) {
  let container = document.getElementById(phase);
  chapters[phase].forEach(ch => {
    fetch(ch.file, {method: 'HEAD'})
      .then(res => {
        if(res.ok){
          container.innerHTML += `
            <div class="topic active">
              <a href="${ch.file}">${ch.name}</a>
            </div>`;
        } else {
          throw "not found";
        }
      })
      .catch(() => {
        container.innerHTML += `
          <div class="topic coming">
            ${ch.name} (Coming Soon)
          </div>`;
      });
  });
}
</script>

</body>
</html>
