        .s-correct { color: var(--success); }

        .container {

        .accordion {
            background-color: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            padding: 18px;
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            font-size: 1.1rem;
            font-weight: 600;

            border-bottom: 1px solid #eee;
            display: flex;

            border-radius: var(--border-radius);
            margin-bottom: 10px;

        }

            background-color: #eef5ff;
            color: var(--primary);
        }

            content: '\002B'; /* Plus sign */
            color: var(--accent);
            font-weight: bold;
            float: right;
            margin-left: 5px;
            font-size: 1.5rem;
        }

            color: white;

            border-radius: 4px;

            .q-input { width: 100%; margin-bottom: 10px; }
            .btn-check { width: 100%; margin-left: 0; }
        }

                {
                    id: "r13", title: "Rule 13: 'One of the' Rule",
                    expl: "After 'One of the', the adjective is Superlative and Noun is Plural.",
                    hinglish: "'One of the' ke baad Noun hamesha plural (bahuvachan) aata hai.",
                    form: "One of the + Superlative + Plural Noun",
                    mistake: "One of the best boy ❌ | One of the best boys ✔",
                    reason: "Selection is made from a group.",
                    questions: [
                        { q: "He is one of the best ______ (boy/boys).", a: "boys" },
                        { q: "Ashoka was one of the greatest ______ (king/kings).", a: "kings" },
                        { q: "This is one of the ______ (old/oldest) buildings.", a: "oldest" },
                        { q: "It is one of the most useful ______ (metal/metals).", a: "metals" },
                        { q: "She is one of the wisest ______ (girl/girls).", a: "girls" },
                        { q: "Mumbai is one of the biggest ______ (city/cities).", a: "cities" },
                        { q: "This is one of the ______ (rare/rarest) coins.", a: "rarest" },
                        { q: "He is one of my best ______ (friend/friends).", a: "friends" },
                        { q: "One of the ______ (tall/tallest) trees.", a: "tallest" },
                        { q: "One of the most famous ______ (actor/actors).", a: "actors" }
                    ]
                }
            ],
            mega: {
                title: "Degrees of Comparison – Mega Practice",
                questions: [
                    { q: "Lead is the ______ (heavy) of all metals.", a: "heaviest" },
                    { q: "He is ______ (strong) than his brother.", a: "stronger" },
                    { q: "She is ______ (intelligent) than beautiful.", a: "more intelligent" },
                    { q: "The pen is ______ (mighty) than the sword.", a: "mightier" },
                    { q: "Prevention is ______ (good) than cure.", a: "better" },
                    { q: "Who is the ______ (rich) man in the world?", a: "richest" },
                    { q: "My horse is ______ (fast) than yours.", a: "faster" },
                    { q: "This is the ______ (bad) movie I have seen.", a: "worst" },
                    { q: "Iron is ______ (useful) than copper.", a: "more useful" },
                    { q: "He is senior ______ me.", a: "to" },
                    { q: "Milk is preferable ______ tea.", a: "to" },
                    { q: "This is the ______ (old) church in the town.", a: "oldest" },
                    { q: "He is the ______ (lazy) boy in class.", a: "laziest" },
                    { q: "No other metal is as ______ (heavy) as lead.", a: "heavy" },
                    { q: "Very few cities are as ______ (big) as Mumbai.", a: "big" },
                    { q: "The higher you go, the ______ (cold) it gets.", a: "colder" },
                    { q: "Death is preferable ______ dishonour.", a: "to" },
                    { q: "She is the ______ (clever) of the two sisters.", a: "cleverer" }, 
                    { q: "This is a ______ (unique) opportunity.", a: "unique" },
                    { q: "The climate of Ranchi is better than ______ of Patna.", a: "that" },
                    { q: "Shakespeare is the ______ (great) dramatist.", a: "greatest" },
                    { q: "Your plan is ______ (good) than mine.", a: "better" },
                    { q: "He is ______ (bad) than you think.", a: "worse" },
                    { q: "Hunger is the ______ (good) sauce.", a: "best" },
                    { q: "Diamond is the ______ (hard) substance.", a: "hardest" },
                    { q: "Of the two boys, he is the ______ (good).", a: "better" },
                    { q: "The ______ (much), the merrier.", a: "more" },
                    { q: "He is ______ (wealthy) than wise.", a: "wealthier" },
                    { q: "This is the ______ (least/less) I can do.", a: "least" },
                    { q: "She is ______ (happy) than her sister.", a: "happier" },
                    { q: "Australia is the ______ (large) island.", a: "largest" },
                    { q: "A live ass is ______ (strong) than a dead lion.", a: "stronger" },
                    { q: "It is ______ (easy) to preach than to practice.", a: "easier" },
                    { q: "Health is ______ (precious) than wealth.", a: "more precious" },
                    { q: "Is your father ______ (well) today?", a: "better" },
                    { q: "There is ______ (little) hope of his recovery.", a: "little" },
                    { q: "He has ______ (much) money than brains.", a: "more" },
                    { q: "The ______ (late) news is good.", a: "latest" },
                    { q: "He is my ______ (old) brother.", a: "elder" },
                    { q: "Kolkata is ______ (far) from Delhi than Patna.", a: "farther" },
                    { q: "Choose the ______ (correct) answer.", a: "correct" },
                    { q: "The air in the hills is ______ (pure) than in the city.", a: "purer" },
                    { q: "Silver is ______ (cheap) than gold.", a: "cheaper" },
                    { q: "The Pacific is the ______ (deep) ocean.", a: "deepest" },
                    { q: "This fabric is inferior ______ that one.", a: "to" },
                    { q: "He is the ______ (able) man for the job.", a: "ablest" },
                    { q: "The condition is becoming ______ (bad) and ______ (bad).", a: "worse and worse" },
                    { q: "This is the ______ (hot) month of the year.", a: "hottest" },
                    { q: "Ravi is ______ (polite) than Raju.", a: "more polite" },
                    { q: "This is the ______ (perfect) example.", a: "perfect" }
                ]
            }
        };

        // --- STATE MANAGEMENT ---
        let state = {
            total: 0,
            correct: 0,
            wrong: 0
        };

        // --- DOM ELEMENTS ---
        const main = document.getElementById('main-content');
        const scoreTotal = document.getElementById('total-count');
        const scoreCorrect = document.getElementById('correct-count');
        const scoreWrong = document.getElementById('wrong-count');
        const scorePercent = document.getElementById('score-percent');

        // --- RENDER FUNCTIONS ---
        function renderPage() {
            let html = '';

            // 1. Intro
            html += `<div class="card">
                        <h2>${contentData.intro.title}</h2>
                        ${contentData.intro.content}
                     </div>`;

            // 2. Types Accordion Section
            html += `<div class="card"><h2>Types of Degrees</h2>`;
            contentData.types.forEach((type, index) => {
                html += `
                    <button class="accordion">${type.title}</button>
                    <div class="panel">
                        <div class="panel-content">
                            <p>${type.desc}</p>
                            <div class="hinglish"><strong>Hinglish:</strong> ${type.hinglish}</div>
                            <div class="formula"><strong>Structure:</strong> ${type.struct}</div>
                            <div class="example-box"><strong>Example:</strong> ${type.ex}</div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;

            // 3. Rules Accordion Section
            html += `<div class="card"><h2>Rules of Comparison</h2>`;
            contentData.rules.forEach((rule, rIndex) => {
                html += `
                    <button class="accordion">${rule.title}</button>
                    <div class="panel">
                        <div class="panel-content">
                            <p><strong>Rule:</strong> ${rule.expl}</p>
                            <div class="hinglish"><strong>Hinglish:</strong> ${rule.hinglish}</div>
                            <div class="formula">${rule.form}</div>
                            
                            <div style="margin: 15px 0;">
                                <p><strong>Common Mistake:</strong></p>
                                <p><span class="badge bg-red">Wrong</span> ${rule.mistake}</p>
                                <p><span class="badge bg-blue">Reason</span> ${rule.reason}</p>
                            </div>

                            <div class="quiz-container">
                                <h3>Practice Exercise</h3>
                                ${renderQuestions(rule.questions, `r${rIndex}`)}
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;

            // 4. Mega Practice
            html += `<div class="card">
                        <h2>${contentData.mega.title}</h2>
                        <p>Test your knowledge with mixed questions from all rules.</p>
                        <div class="quiz-container">
                            ${renderQuestions(contentData.mega.questions, 'mega')}
                        </div>
                     </div>`;

            main.innerHTML = html;
            attachEventListeners();
        }

        function renderQuestions(questions, prefix) {
            return questions.map((q, i) => {
                const qId = `${prefix}-q${i}`;
                const hint = q.hint ? `<br><small style="color: #666">(${q.hint})</small>` : '';
                return `
                    <div class="q-item">
                        <div class="q-text">${i + 1}. ${q.q} ${hint}</div>
                        <div style="display:flex; flex-wrap:wrap; align-items:center;">
                            <input type="text" class="q-input" id="in-${qId}" placeholder="Type answer here...">
                            <button class="btn-check" onclick="checkAnswer('${qId}', '${q.a.replace(/'/g, "\\'")}')">Check</button>
                        </div>
                        <div class="feedback" id="fb-${qId}"></div>
                    </div>
                `;
            }).join('');
        }

        // --- INTERACTION LOGIC ---
        function attachEventListeners() {
            // Accordions
            const acc = document.getElementsByClassName("accordion");
            for (let i = 0; i < acc.length; i++) {
                acc[i].addEventListener("click", function() {
                    this.classList.toggle("active");
                    var panel = this.nextElementSibling;
                    if (panel.style.maxHeight) {
                        panel.style.maxHeight = null;
                    } else {
                        panel.style.maxHeight = panel.scrollHeight + "px";
                    }
                });
            }
        }

        // --- GAME LOGIC ---
        window.checkAnswer = function(id, correctAns) {
            const input = document.getElementById(`in-${id}`);
            const btn = input.nextElementSibling;
            const feedback = document.getElementById(`fb-${id}`);
            
            // Normalize
            const userAns = input.value.trim().toLowerCase();
            const validAns = correctAns.toLowerCase();

            // Prevent empty checks
            if(!userAns) return;

            // Logic
            state.total++;
            
            if (userAns === validAns) {
                state.correct++;
                feedback.className = "feedback correct";
                feedback.innerHTML = `<strong>✔ Correct!</strong> Well done.`;
            } else {
                state.wrong++;
                feedback.className = "feedback wrong";
                feedback.innerHTML = `<strong>❌ Wrong.</strong> The correct answer is: <strong>${correctAns}</strong>`;
            }

            // Update UI
            input.disabled = true;
            btn.disabled = true;
            btn.innerText = "Checked";
            updateScoreboard();
        };

        function updateScoreboard() {
            scoreTotal.innerText = state.total;
            scoreCorrect.innerText = state.correct;
            scoreWrong.innerText = state.wrong;
            
            const percent = state.total === 0 ? 0 : Math.round((state.correct / state.total) * 100);
            scorePercent.innerText = percent + "%";
            
            if(percent >= 80) scorePercent.style.color = "var(--success)";
            else if(percent >= 50) scorePercent.style.color = "var(--accent-hover)";
            else scorePercent.style.color = "var(--error)";
        }

        // --- INIT ---
        renderPage();

    </script>
</body>
