<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Tenses - Grammar Learning Hub</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --accent: #f59e0b;
            --bg: #f0f4f8;
            --text: #1e293b;
            --white: #ffffff;
            --success: #10b981;
            --error: #ef4444;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 3rem 1rem;
            text-align: center;
            box-shadow: var(--shadow);
            border-bottom: 5px solid var(--accent);
        }

        .container {
            max-width: 1000px;
            margin: -2rem auto 2rem;
            padding: 0 1rem;
        }

        /* Tense Selection Navigation */
        #main-nav {
            background: var(--white);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .tense-category {
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .category-header {
            padding: 1.2rem;
            cursor: pointer;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.3rem;
            font-weight: 700;
            transition: background 0.3s;
        }

        .category-header:hover { background: #edf2f7; }

        .sub-tenses {
            display: none;
            padding: 0.5rem;
            background: white;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sub-tense-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.8rem 1.2rem;
            margin: 4px 0;
            border: none;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: #475569;
            transition: all 0.2s;
        }

        .sub-tense-btn:hover {
            background: #f1f5f9;
            color: var(--primary);
            padding-left: 2rem;
        }

        /* Content Panel */
        .content-panel {
            display: none;
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: scale(0.98); } 
            to { opacity: 1; transform: scale(1); } 
        }

        .back-btn {
            background: var(--text);
            color: white;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 1.5rem;
            font-weight: 600;
            transition: background 0.3s;
        }

        .back-btn:hover { background: #000; }

        .formula-box {
            background: linear-gradient(to right, #eff6ff, #f5f3ff);
            border-left: 6px solid var(--primary);
            padding: 1.5rem;
            margin: 1.5rem 0;
            border-radius: 0 12px 12px 0;
            font-family: 'Courier New', monospace;
        }

        /* Practice Area */
        .question-card {
            background: #fff;
            border: 2px solid #f1f5f9;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.2rem;
            transition: transform 0.2s;
        }

        .question-card:hover { transform: translateY(-3px); border-color: #cbd5e1; }

        .input-group { display: flex; gap: 12px; margin-top: 12px; }
        input[type="text"] {
            flex: 1;
            padding: 0.9rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus { border-color: var(--primary); background: #fdfdfd; }

        .check-btn {
            background: var(--primary);
            color: white;
            padding: 0.9rem 1.8rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .check-btn:hover { background: var(--secondary); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(124, 58, 237, 0.3); }
        .check-btn:active { transform: scale(0.95); }

        .feedback { 
            margin-top: 12px; 
            padding: 10px;
            border-radius: 6px;
            font-weight: 600; 
            display: none; 
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .correct { background: #dcfce7; color: var(--success); border-left: 4px solid var(--success); }
        .wrong { background: #fee2e2; color: var(--error); border-left: 4px solid var(--error); }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .b-aff { background: #dcfce7; color: #166534; }
        .b-neg { background: #fee2e2; color: #991b1b; }
        .b-int { background: #e0e7ff; color: #3730a3; }
    </style>
</head>
<body>

<header>
    <h1 style="font-size: 2.5rem; margin: 0;">English Tense Mastery</h1>
    <p style="font-size: 1.1rem; opacity: 0.9;">Professional Notes & Interactive Practice Hub</p>
</header>

<div class="container">
    <div id="main-nav">
        <div class="tense-category">
            <div class="category-header" onclick="toggleSub('present-sub')">

                <button class="sub-tense-btn" onclick="showTense('pres_perf')">Present Perfect</button>
                <button class="sub-tense-btn" onclick="showTense('pres_perf_cont')">Present Perfect Continuous</button>
            </div>

        <div class="tense-category">
            <div class="category-header" onclick="toggleSub('past-sub')">

            <div class="sub-tenses" id="past-sub">

                <button class="sub-tense-btn" onclick="showTense('past_cont')">Past Continuous</button>

        <div class="tense-category">

            <div class="sub-tenses" id="future-sub">

            </div>
        </div>
    </div>

    <div id="content-panel" class="content-panel">

        <div id="tense-data"></div>
    </div>
</div>

<script>

            {q: "I ____ (waiting) since 5.", a: "will have been waiting", type: "Affirmative"}
        ]
    }
};

/* ================= APP LOGIC ================= */
function toggleSub(id) {
    const el = document.getElementById(id);
    const allSubs = document.querySelectorAll('.sub-tenses');
    allSubs.forEach(sub => { if(sub.id !== id) sub.style.display = 'none'; });
    el.style.display = el.style.display === "block" ? "none" : "block";
}

function showTense(key) {
    const data = tenseData[key];
    document.getElementById('main-nav').style.display = 'none';
    const panel = document.getElementById('content-panel');
    panel.style.display = 'block';
    window.scrollTo(0, 0);

    let html = `
        <h2 style="color:var(--primary); font-size: 2rem; margin-top:0;">${data.title}</h2>
        <p style="font-size: 1.1rem; border-left: 4px solid var(--accent); padding-left:15px;">
            <strong>Concept:</strong> ${data.def}
        </p>
        
        <div class="formula-box">
            <strong style="color:var(--secondary)">Structures:</strong><br><br>
            ${data.formulas.map(f => `• ${f}`).join('<br>')}
        </div>

        <div style="background:#fff9f0; padding:15px; border-radius:10px; margin: 20px 0;">
            <strong>Pro Tip:</strong> ${data.expl}<br>
            <strong>Standard Example:</strong> <em>${data.example}</em>
        </div>

        <div class="practice-area">
            <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px;">Interactive Practice (30 Questions)</h3>
            <p style="color:#666; margin-bottom:20px;">Complete the sentences with correct verb forms. Click "Check" to verify.</p>
            <div id="questions-list"></div>
        </div>
    `;

    document.getElementById('tense-data').innerHTML = html;

    const qList = document.getElementById('questions-list');
    data.questions.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'question-card';
        div.innerHTML = `
            <div><span class="badge ${getBadgeClass(item.type)}">${item.type}</span> <strong>${index+1}.</strong> ${item.q}</div>
            <div class="input-group">
                <input type="text" id="ans-${index}" placeholder="Type your answer...">
                <button class="check-btn" onclick="checkAnswer(${index}, '${item.a.replace(/'/g, "\\'")}')">Check</button>
            </div>
            <div id="feedback-${index}" class="feedback"></div>
        `;
        qList.appendChild(div);
    });
}

function getBadgeClass(type) {
    if(type === "Affirmative") return "b-aff";
    if(type === "Negative") return "b-neg";
    return "b-int";
}

function checkAnswer(idx, correct) {
    const userAns = document.getElementById(`ans-${idx}`).value.trim().toLowerCase();
    const fb = document.getElementById(`feedback-${idx}`);
    fb.style.display = "block";

    if(userAns === correct.toLowerCase()) {
        fb.innerHTML = "✨ Excellent! That's the correct form.";
        fb.className = "feedback correct";
    } else {
        fb.innerHTML = `⚠️ Oops! The correct answer is: <strong>${correct}</strong>`;
        fb.className = "feedback wrong";
    }
}

function goBack() {
    document.getElementById('main-nav').style.display = 'block';
    document.getElementById('content-panel').style.display = 'none';
}
</script>

</body>
